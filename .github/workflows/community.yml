name: Community feed

# O "backend" do carrossel da Home: consulta o Instagram Graph API e o Tumblr,
# guarda as miniaturas em community/ e publica community/feed.json (+ o seed
# no index.html, que é o que o APK usa sem internet).
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   IG_TOKEN     token de acesso do Instagram Graph API (conta business/creator)
#   IG_USER_ID   id da conta do Instagram ligada à página
#   TUMBLR_KEY   consumer key da aplicação do Tumblr
#
# Variável opcional (não é segredo): TUMBLR_BLOG. O coletor lê esse blog direto,
# mas só os posts marcados com a hashtag entram no carrossel.
#
# Sem os segredos o job roda, não acha nada e não altera nenhum arquivo.
on:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/community.mjs'
      - '.github/workflows/community.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: community-feed
  cancel-in-progress: false

jobs:
  fetch:
    name: Coletar #everythingeditor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar o redutor de miniaturas
        # opcional: sem isso o coletor guarda a imagem como veio
        run: npm install --no-save --no-audit --no-fund sharp

      - name: Coletar e cachear os posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TUMBLR_KEY: ${{ secrets.TUMBLR_KEY }}
          TUMBLR_BLOG: ${{ vars.TUMBLR_BLOG || 'mdgverse' }}
        run: node scripts/community.mjs

      - name: Publicar se algo mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "everything-editor-bot"
          git config user.email "everything-editor-bot@users.noreply.github.com"
          git add community index.html
          if git diff --cached --quiet; then
            echo "nada novo no feed"
          else
            git commit -m "comunidade: atualiza o feed do carrossel"
            git push origin HEAD:main
            # push feito com o GITHUB_TOKEN não dispara outros workflows:
            # o site e o APK precisam ser chamados na mão
            gh workflow run deploy-pages.yml --ref main || echo "aviso: não deu para disparar o Pages"
            gh workflow run build-apk.yml --ref main || echo "aviso: não deu para disparar o APK"
          fi
