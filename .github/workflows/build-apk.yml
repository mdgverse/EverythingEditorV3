name: Build APK

# Gera o APK do Everything Editor a cada mudança no editor ou no projeto Android.
# O APK assinado vai para a Release "apk-latest" e pode ser instalado direto no celular.
on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'index.html'
      - 'VERSION'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # O runner do GitHub já vem com o Android SDK. Só instala o que faltar.
      - name: Android SDK
        run: |
          set +e
          SDL="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "SDK em: $SDL"
          ls "$SDL/platforms" 2>/dev/null
          ls "$SDL/build-tools" 2>/dev/null
          SM="$SDL/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          if [ ! -d "$SDL/platforms/android-35" ] || [ ! -d "$SDL/build-tools/35.0.0" ]; then
            echo "Instalando platform 35 / build-tools 35…"
            yes | "$SM" --licenses > /dev/null 2>&1
            "$SM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          fi
          echo "android.home=$SDL" > /dev/null
          exit 0

      # A chave fica no repositório para que as atualizações do app sejam aceitas
      # por cima da versão instalada (mesma assinatura em todos os builds).
      - name: Chave de assinatura
        run: |
          set -e
          KS=android/app/keystore/release.jks
          if [ -f "$KS" ]; then
            echo "Keystore já existe — reutilizando."
            exit 0
          fi
          mkdir -p "$(dirname "$KS")"
          keytool -genkeypair -v \
            -keystore "$KS" \
            -alias everythingeditor \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass everythingeditor -keypass everythingeditor \
            -dname "CN=Everything Editor, OU=mdgverse, O=mdgverse, L=Vitoria da Conquista, ST=BA, C=BR"
          git config user.name "apk-bot"
          git config user.email "apk-bot@users.noreply.github.com"
          git add -f "$KS"
          git commit -m "chore(apk): chave de assinatura fixa (sideload)"
          git push || echo "::warning::Não foi possível commitar a keystore; os próximos builds terão assinatura diferente."

      # A versão do app vem do arquivo VERSION na raiz (mesmo número que a
      # telinha de entrada mostra). versionCode continua sendo o run number,
      # que só cresce — é o que o Android exige para aceitar a atualização.
      - name: Versão
        id: ver
        run: |
          set -e
          VER=$(tr -d '[:space:]' < VERSION)
          case "$VER" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION inválido: '$VER'"; exit 1 ;;
          esac
          grep -q "APP_VERSION = '$VER'" index.html || { echo "::error::index.html não tem APP_VERSION = '$VER' (VERSION e a telinha saíram de sincronia)"; exit 1; }
          echo "versão $VER"
          echo "name=$VER" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          cd android
          gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Artefatos
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          # o editor precisa estar dentro do pacote, senão o app abre em branco
          unzip -l "$APK" | grep -q 'assets/index.html' || { echo "::error::assets/index.html não entrou no APK"; exit 1; }
          SRC=$(wc -c < index.html)
          echo "index.html na raiz: $SRC bytes"
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" | head -5
          mkdir -p dist
          VER="${{ steps.ver.outputs.name }}"
          cp "$APK" "dist/everything-editor-$VER.apk"
          cp "$APK" dist/EverythingEditor.apk          # link fixo (sempre a última)
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/everything-editor-$VER.aab"
          cp "dist/everything-editor-$VER.aab" dist/EverythingEditor.aab
          ls -la dist

      - name: Upload (artefato da execução)
        uses: actions/upload-artifact@v4
        with:
          name: EverythingEditor-apk
          path: dist/*
          if-no-files-found: error

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER="${{ steps.ver.outputs.name }}"
          NOTES="Everything Editor **v$VER** — commit ${GITHUB_SHA:0:7}.
          Baixe \"everything-editor-$VER.apk\" (a versão mais recente também fica em \"EverythingEditor.apk\").
          Instale no celular (Android 10+) permitindo \"instalar apps desconhecidos\"."
          if ! gh release view apk-latest > /dev/null 2>&1; then
            gh release create apk-latest \
              --title "Everything Editor — APK" \
              --notes "$NOTES"
          fi
          gh release edit apk-latest --title "Everything Editor — APK v$VER" --notes "$NOTES"
          gh release upload apk-latest \
            "dist/everything-editor-$VER.apk" "dist/everything-editor-$VER.aab" \
            dist/EverythingEditor.apk dist/EverythingEditor.aab --clobber

      # mantém a release com UMA versão só: apaga os assets de versões antigas
      - name: Limpar versões antigas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER="${{ steps.ver.outputs.name }}"
          gh release view apk-latest --json assets -q '.assets[].name' | while read -r nome; do
            case "$nome" in
              "everything-editor-$VER.apk"|"everything-editor-$VER.aab"|EverythingEditor.apk|EverythingEditor.aab) ;;
              *) echo "removendo $nome"; gh release delete-asset apk-latest "$nome" -y ;;
            esac
          done

      - name: Resumo
        run: |
          {
            echo "### 📱 APK v${{ steps.ver.outputs.name }} publicado"
            echo ""
            echo "Direto: https://github.com/${{ github.repository }}/releases/download/apk-latest/everything-editor-${{ steps.ver.outputs.name }}.apk"
            echo ""
            echo "Fixo (sempre a última): https://github.com/${{ github.repository }}/releases/download/apk-latest/EverythingEditor.apk"
            echo ""
            echo "versionName \`${{ steps.ver.outputs.name }}\` · versionCode \`${{ github.run_number }}\` · commit \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
