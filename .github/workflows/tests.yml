name: Tests

on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  assets:
    name: Assets e sessão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Importação de Assets (sem ZIP, motivos, parada por cota)
        run: node tests/assets-import.test.mjs
      - name: Assets · seleção múltipla, mover para pasta e recorte em lote
        run: node tests/assets-select.test.mjs
      - name: Sessão e limpeza (teto de memória, atalhos de URL, apagar tudo)
        run: node tests/session.test.mjs
      - name: Menu radial de categorias (Shift+A → lista → volta)
        run: node tests/add-menu.test.mjs
      - name: Gradient map · pinos do mesh
        run: node tests/gradient-pins.test.mjs
      - name: Backup/Restore (projetos, pastas e Assets num .json)
        run: node tests/backup.test.mjs
      - name: Restore ao lado de Assets e zoom mínimo
        run: node tests/topbar.test.mjs
      - name: Fio Angled Orthogonal (geometria, interação e persistência)
        run: node tests/wire-angled.test.mjs
      - name: Quinas do fio (criar, arrastar, fio reto e zip tie)
        run: node tests/pivot.test.mjs
      - name: Spraydelic (conversão local de máscaras)
        run: node tests/spray-local-mask.test.mjs
      - name: Spraydelic (máscaras, paletas e controles)
        run: node tests/spraydelic-upgrade.test.mjs
      - name: Topog
        run: node tests/topog.test.mjs
      - name: Glass fracture (mapa, deslocamento, freeze e blur)
        run: node tests/glass-fracture.test.mjs
      - name: Efeito Spin Focus Light Leak (Editor 3.0)
        run: node tests/spin-focus.test.mjs
      - name: Efeito Perspective Warp (Editor 3.1 · Perspectivo)
        run: node tests/perspective.test.mjs
      - name: Zoom mínimo (canvas, preview e máscara em 5%)
        run: node tests/zoom.test.mjs
      - name: Nó Scribble (textura de pincel, deslocamento e dither)
        run: node tests/scribble.test.mjs
      - name: Layer mix (mesclagem no lugar, sem cópia da camada)
        run: node tests/layermix.test.mjs
      - name: Screencast keys (interruptor no menu da marca e overlay de entradas)
        run: node tests/screencast.test.mjs
      - name: Ramp generator (harmonias, HSV global, presets e import/export)
        run: node tests/ramp-generator.test.mjs
      - name: Comunidade (carrossel da Home e coletor do feed)
        run: node tests/community.test.mjs
      - name: Layers (position) — o stack de camadas restaurado
        run: node tests/layerstack.test.mjs
      - name: Displacement v6 (heightmap, normal, vetor, borda, interpolação e ruído)
        run: node tests/displacement.test.mjs
      - name: Layer Position (renomear por id e persistir)
        run: node tests/layers-rename.test.mjs
      - name: Layer Position (reordenar leva o nome junto — teste funcional)
        run: node tests/layers-reorder.test.mjs
      - name: Array Machine (glifos, SVG do usuário e SVG da biblioteca)
        run: node tests/array-machine.test.mjs
      - name: Remoção dos nós Shader (Blender)
        run: node tests/shader-removal.test.mjs
      - name: Remoções 3.8.0 (Layer Comp e anotações fora, sem resíduo)
        run: node tests/cleanup.test.mjs
      - name: Versão (VERSION = index.html = APK)
        run: node tests/version.test.mjs
      - name: Higiene (código morto, CSS sem uso, reference/ fora)
        run: node tests/hygiene.test.mjs
      - name: Boot · toda função chamada existe (compileShader e cia)
        run: node tests/boot-symbols.test.mjs

  glsl:
    name: GLSL (sintaxe dos shaders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parser GLSL
        run: npm install --no-save --prefix /tmp/glsl @shaderfrog/glsl-parser
      - name: Sintaxe de todos os fragment shaders
        run: GLSL_PARSER=/tmp/glsl/node_modules/@shaderfrog/glsl-parser/index.js node tests/glsl-parse.test.mjs
