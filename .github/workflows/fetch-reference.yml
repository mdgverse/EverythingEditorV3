name: Fetch reference APK

# Baixa o APK de referência (Drive), extrai o HTML que está dentro dele e
# commita em reference/ para análise local. Workflow temporário: pode ser
# removido depois que as medidas forem extraídas.
on:
  push:
    paths:
      - '.github/workflows/fetch-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar do Drive
        run: |
          set -e
          FILE_ID="1Nk-EtFn_-mwqfDdyIp5D1P1oh-rwsDb1"      # everything-editor-2.9.26.apk
          curl -sSL -o ref.apk "https://drive.google.com/uc?export=download&id=$FILE_ID"
          ls -la ref.apk
          file ref.apk
          head -c 4 ref.apk | xxd

      - name: Extrair assets
        run: |
          set -e
          mkdir -p reference
          echo "=== conteúdo do APK (assets/res relevante) ==="
          unzip -l ref.apk | grep -Ei 'assets/|\.html|\.js|\.css|AndroidManifest' | head -60
          echo
          echo "=== extraindo ==="
          unzip -o -q ref.apk -d ref_extract || true
          ls -la ref_extract/assets 2>/dev/null || true
          find ref_extract -maxdepth 3 -name "*.html" -o -maxdepth 3 -name "*.js" | head -20

      - name: Guardar referência
        run: |
          set +e
          rm -rf reference
          mkdir -p reference
          # extrai tudo de novo (garantido) e registra a árvore
          unzip -o -q ref.apk -d ref_extract
          ( cd ref_extract && find . -type f | sort > ../reference/listing.txt )
          ( cd ref_extract && ls -la assets assets/www 2>/dev/null >> ../reference/listing.txt )
          echo "--- arquivos html encontrados ---" >> reference/listing.txt
          find ref_extract -name '*.html' -exec ls -l {} \; >> reference/listing.txt
          # copia os html (o da UI fica em assets/www/index.html)
          for f in $(find ref_extract -name '*.html' -size -8M); do
            base=$(echo "$f" | sed 's#ref_extract/##; s#/#__#g')
            cp "$f" "reference/$base"
            echo "copiado: $f -> reference/$base ($(wc -c < "$f") bytes)"
          done
          # copia qualquer js/css de assets (a camada mobile pode estar lá)
          for f in $(find ref_extract/assets -name '*.js' -o -name '*.css' -size -2M 2>/dev/null); do
            base=$(echo "$f" | sed 's#ref_extract/##; s#/#__#g')
            [ -f "reference/$base" ] || cp "$f" "reference/$base"
          done
          ls -la reference | head -30
          exit 0

      - name: Commit da referência
        run: |
          set -e
          git config user.name "ref-bot"
          git config user.email "ref-bot@users.noreply.github.com"
          git add reference
          git commit -m "chore(ref): HTML extraído do APK de referência 2.9.26" || echo "nada para commitar"
          git push || echo "::warning::push falhou"

      - name: Resumo
        run: |
          {
            echo "### Referência extraída"
            echo ""
            echo "Arquivo: \`reference/index-2.9.26.html\` ($(wc -c < reference/index-2.9.26.html) bytes)"
          } >> "$GITHUB_STEP_SUMMARY"
