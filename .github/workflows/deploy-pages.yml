name: Deploy to GitHub Pages

# Publicação automática: sempre que houver push (index.html atualizado, por exemplo),
# o site público é reconstruído e republicado no GitHub Pages.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no Pages via Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Só um deploy por vez; um push novo cancela o deploy anterior ainda em andamento
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
               "https://api.github.com/repos/$REPO/pages" >/dev/null; then
            echo "GitHub Pages está habilitado ✅"
          else
            {
              echo "### ⚠️ GitHub Pages ainda não está habilitado"
              echo ""
              echo "Ative uma única vez em: https://github.com/$REPO/settings/pages"
              echo ""
              echo "Em **Build and deployment → Source**, escolha **GitHub Actions** e salve."
              echo "Depois disso cada push publica o site automaticamente."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Habilite o GitHub Pages::Abra https://github.com/$REPO/settings/pages e escolha Source = GitHub Actions (uma única vez)."
            exit 1
          fi

      - name: Prepare static site
        run: |
          set -e
          if [ ! -f index.html ]; then
            echo "::error::index.html não encontrado na raiz do repositório"
            exit 1
          fi
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          # o feed e as miniaturas do carrossel da comunidade
          if [ -d community ]; then cp -R community _site/community; fi
          touch _site/.nojekyll
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: success()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### 🌐 Site publicado"
            echo ""
            echo "$PAGE_URL"
            echo ""
            echo "Commit \`${{ github.sha }}\` · branch \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Ajuda a diagnosticar problemas de publicação (configuração do Pages,
      # modo de build e branches liberadas no environment github-pages).
      - name: Diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### 🔎 Diagnóstico"
            echo ""
            echo '#### Configuração do Pages (`/pages`)'
            echo '```json'
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/pages" | head -c 2000
            echo '```'
            echo ""
            echo '#### Branches liberadas no environment `github-pages`'
            echo '```json'
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/environments/github-pages/deployment-branch-policies" | head -c 1000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
